name: Deploy to EC2

# Full CD pipeline for Stage 7:
#   1. build-and-push : build both images, push to GHCR tagged with the commit SHA
#   2. terraform      : provision the AWS infra (VPC, subnet, EC2, CloudWatch) and
#                       output the instance's public IP
#   3. deploy         : SSH into the Terraform-created box, copy the compose file
#                       and code, pull the images, run the stack, smoke test
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/ibraheembello/dream-vacation-capstone-backend
  FRONTEND_IMAGE: ghcr.io/ibraheembello/dream-vacation-capstone-frontend
  AWS_REGION: eu-west-2

jobs:
  # ---------- Build & push both images tagged with the commit SHA ----------
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- Provision AWS infra with Terraform ----------
  terraform:
    name: Terraform provision
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: eu-west-2
      TF_VAR_ssh_public_key: ${{ secrets.EC2_SSH_PUBLIC_KEY }}
    outputs:
      ec2_ip: ${{ steps.tf_out.outputs.ec2_ip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Export EC2 public IP
        id: tf_out
        run: echo "ec2_ip=$(terraform output -raw ec2_public_ip)" >> "$GITHUB_OUTPUT"

  # ---------- SSH into the Terraform box and roll out the app ----------
  deploy:
    name: Deploy to EC2 over SSH
    needs: terraform
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      EC2_HOST: ${{ needs.terraform.outputs.ec2_ip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Wait for SSH + Docker on the new instance
        run: |
          echo "Target instance: $EC2_HOST"
          for i in $(seq 1 30); do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/id_rsa \
                 ubuntu@"$EC2_HOST" 'docker info >/dev/null 2>&1 && echo ready' 2>/dev/null | grep -q ready; then
              echo "Instance is ready"
              exit 0
            fi
            echo "  waiting for cloud-init / docker ($i) ..."
            sleep 10
          done
          echo "Instance did not become ready in time"
          exit 1

      - name: Copy deployment files to EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@"$EC2_HOST" 'mkdir -p /home/ubuntu/app'
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa docker-compose.prod.yml ubuntu@"$EC2_HOST":/home/ubuntu/app/
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa deploy/remote-deploy.sh   ubuntu@"$EC2_HOST":/home/ubuntu/app/
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa -r db                     ubuntu@"$EC2_HOST":/home/ubuntu/app/

      - name: Roll out on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@"$EC2_HOST" \
            "POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD }}' \
             GHCR_USER='${{ github.actor }}' \
             GHCR_TOKEN='${{ secrets.GITHUB_TOKEN }}' \
             IMAGE_TAG='sha-${{ github.sha }}' \
             bash /home/ubuntu/app/remote-deploy.sh"

      - name: Smoke-test the public endpoint
        run: |
          echo "Waiting for the app to answer on http://$EC2_HOST/ ..."
          # Host Nginx redirects 80 -> 443 once SSL is configured, so a 301/302
          # is just as healthy as a 200 here. Follow redirects for the final check.
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://$EC2_HOST/" || true)
            echo "  attempt $i -> HTTP $code"
            case "$code" in
              200|301|302) echo "App is live (HTTP $code)"; exit 0 ;;
            esac
            sleep 6
          done
          echo "App did not return a healthy status in time"; exit 1
